<pl-question-panel>
    <h2><code>pl-big-operator-input</code> examples</h2>
</pl-question-panel>
<p>Bounded sum:</p>
<pl-big-operator-input answers-name="sum" operator="sum" index-variable="k"></pl-big-operator-input>
<p>Bounded product:</p>
<pl-big-operator-input answers-name="product" operator="product" index-variable="k"></pl-big-operator-input>
<p>Integral:</p>
<pl-big-operator-input answers-name="integral" operator="integral" index-variable="x"></pl-big-operator-input>
<p>Right-hand limit:</p>
<pl-big-operator-input
    answers-name="limit"
    operator="limit"
    index-variable="x"
    limit-direction="from-right"
></pl-big-operator-input>
<p>Domain-indexed union:</p>
<pl-big-operator-input
    answers-name="union"
    operator="union"
    index-variable="k"
    grading-method="exact"
></pl-big-operator-input>
<p>Domain-indexed conjunction:</p>
<pl-big-operator-input answers-name="and" operator="and" index-variable="k" grading-method="exact"></pl-big-operator-input>
