<pl-question-panel>
  <p>Fill in the blanks to reproduce the following sum:</p>
  <p>\[\displaystyle \sum_{j=-3}^{3} (2j+1)\]</p>

  <pl-sum-notation-input
    answers-name="sum"
    index-variable="j"
    start-answer="-3"
    end-answer="3"
    summand-answer="2*j + 1"
  ></pl-sum-notation-input>
</pl-question-panel>
