[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "template"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["prairielearn", "chevron", "lxml"]

[tool.uv.sources.prairielearn]
git = "https://github.com/PrairieLearn/PrairieLearn.git"
rev = "2c60f70a0ef817a2dc33fe15cb8e56de5035d6ed"
subdirectory = "apps/prairielearn/python"


[dependency-groups]
dev = ["ipython", "pyright", "pytest", "ruff"]

[tool.pyright]
include = ["elements", "questions", "scripts", "src"]
exclude = ["elements/pl-big-operator-input/vendor"]

[tool.ruff]
exclude = ["elements/pl-big-operator-input/vendor"]
