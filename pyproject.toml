[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "template"
version = "1.1.0"
requires-python = ">=3.13"
dependencies = ["prairielearn", "chevron", "lxml"]

[dependency-groups]
dev = [
    "ipython",
    "jsonschema",
    "pl-vendor>=0.4.2",
    "pyright",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["e2e-tests"]
markers = [
    "generate: question generate-phase lifecycle checks",
    "prepare: question prepare-phase lifecycle checks",
    "render: question render-phase lifecycle checks",
    "grade: question grading lifecycle checks",
]

[tool.uv.sources.prairielearn]
git = "https://github.com/PrairieLearn/PrairieLearn.git"
rev = "0327fea1b86cadd968f215ebcf6506ee8fff0d65" # PrairieLearn master snapshot; unmerged helpers are vendored below
subdirectory = "apps/prairielearn/python"

[tool.setuptools.packages.find]
where = ["e2e-tests", "src"]
include = ["pl_big_operator_input", "prairielearn_e2e"]

[tool.setuptools.package-data]
prairielearn_e2e = ["config.json"]

[tool.pyright]
include = ["e2e-tests", "elements", "questions", "scripts", "src"]
exclude = ["**/vendor", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]
extraPaths = [".", "e2e-tests"]

[tool.ruff]
exclude = ["**/vendor", "scripts/prompts/output"]

[tool.pl-vendor]
required-version = "^0.4"

[tool.pl-vendor.packages.prairielearn-symbolic-input]
path = "elements/pl-big-operator-input/vendor/prairielearn/pl-symbolic-input"
url = "https://github.com/PrairieLearn/PrairieLearn.git"
commit = "0952fbfcde4fee9d8a007e87deaeb49970598c05"
subdirectory = "apps/prairielearn/elements/pl-symbolic-input"

[tool.pl-vendor.packages.prairielearn-big-operator-python]
path = "elements/pl-big-operator-input/vendor/pl_big_operator_python"
url = "https://github.com/PrairieLearn/PrairieLearn.git"
commit = "0952fbfcde4fee9d8a007e87deaeb49970598c05"
subdirectory = "apps/prairielearn/python/prairielearn"
