[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "template"
version = "1.1.0"
requires-python = ">=3.13"
dependencies = ["prairielearn", "chevron", "lxml"]

[tool.uv.sources.prairielearn]
git = "https://github.com/PrairieLearn/PrairieLearn.git"
rev = "14e65830861bee4cfe10c3ef73b000794edd66ed" # delibrately pinned for vendored pl-symbolic-input
subdirectory = "apps/prairielearn/python"


[dependency-groups]
dev = ["ipython", "pyright", "pytest", "ruff"]

[tool.pyright]
include = ["elements", "questions", "scripts", "src"]
exclude = ["**/vendor", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]

[tool.ruff]
exclude = ["**/vendor", "scripts/prompts/output"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "smoke: fast publication-critical lifecycle and documentation contracts",
  "regression: named bug or compatibility contract",
  "unit: focused project-owned unit and characterization tests",
  "vendor_contract: project adapter compatibility with the pinned PrairieLearn snapshot",
  "browser: DOM/CSS layout or accessibility behavior requiring a browser",
]
