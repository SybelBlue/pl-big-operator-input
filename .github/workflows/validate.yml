name: Validate

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: make check-format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Typecheck
        run: make typecheck
    
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Materialize pinned PrairieLearn clone
        run: |
          pl_commit=$(uv run --active python -c 'import json; from importlib.metadata import distribution; print(json.loads(distribution("prairielearn").read_text("direct_url.json"))["vcs_info"]["commit_id"])')
          pl_checkout=$(mktemp -d "$RUNNER_TEMP/prairielearn.XXXXXX")
          git -C "$pl_checkout" init --quiet --initial-branch=main
          git -C "$pl_checkout" remote add origin https://github.com/PrairieLearn/PrairieLearn.git
          git -C "$pl_checkout" fetch --depth=1 origin "$pl_commit"
          git -C "$pl_checkout" checkout --detach FETCH_HEAD
          echo "PRAIRIELEARN_PATH=$pl_checkout" >> "$GITHUB_ENV"

      - name: Test
        run: make test

      - name: Run e2e fuzz tests
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make test-e2e-fuzz

  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install development tools
        run: uv sync --locked --only-dev

      - name: Verify vendored dependencies
        run: make verify-vendor
